name: Checks

# Runs on every push and pull request: the same checks as `npm run check`
# and `npx expo lint` on a computer. Takes a few minutes and needs no secrets.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Translations, types, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Translations, types and tests
        run: npm run check

      - name: Lint
        run: npx expo lint
