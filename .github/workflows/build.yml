name: Build apps

# Builds installable Android files on GitHub's own machines and names them:
#
#   ba7dhek-v<version>-<variant>-<commit>.<apk|aab>
#
#   devclient  development build for day-to-day work, talks to the dev backend   (.apk)
#   dev        standalone app for testing, talks to the dev backend               (.apk)
#   prod       standalone app, talks to the production backend                    (.apk)
#   store      the file Google Play asks for, production backend                  (.aab)
#
# Where the file goes:
#   - started by hand: a pre-release per variant ("build-dev", "build-prod", ...),
#     replaced by each new build of that variant, so its page always holds the latest;
#   - started by pushing a tag such as v0.1.0: dev, prod and store, attached to
#     a release of that name.
#
# Files go to releases, not to Actions artifacts: the account's artifact storage
# is shared with other repositories and full, and release files do not count
# against it.
#
# Needs one repository secret, EXPO_TOKEN: the build uses it to fetch the
# Android signing key that Expo keeps for the project. See docs/03-build/ci.md.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: What to build
        type: choice
        default: dev
        options: [dev, prod, devclient, store, all]
      ios_simulator:
        description: Also build for the iOS simulator (runs on a Mac machine; cannot be installed on an iPhone)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        env:
          CHOSEN: ${{ inputs.variant }}
          EVENT: ${{ github.event_name }}
        run: |
          # Each variant: its name in the file, the profile in eas.json, and the kind of file.
          all='[
            {"variant":"devclient","profile":"development","ext":"apk"},
            {"variant":"dev","profile":"staging","ext":"apk"},
            {"variant":"prod","profile":"preview","ext":"apk"},
            {"variant":"store","profile":"production","ext":"aab"}
          ]'
          if [ "$EVENT" = "push" ]; then
            # A release: everything a tester or the store needs. The development build is for whoever writes the code.
            matrix=$(echo "$all" | jq -c '[.[] | select(.variant != "devclient")]')
          elif [ "$CHOSEN" = "all" ]; then
            matrix=$(echo "$all" | jq -c '.')
          else
            matrix=$(echo "$all" | jq -c --arg v "$CHOSEN" '[.[] | select(.variant == $v)]')
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.expo.version' app.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  android:
    name: Android ${{ matrix.variant }}
    needs: plan
    runs-on: ubuntu-latest
    # A first build with an empty cache takes about 40 minutes; later ones reuse the cache.
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      FILE: ba7dhek-v${{ needs.plan.outputs.version }}-${{ matrix.variant }}-${{ needs.plan.outputs.sha }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7

      - name: Stop early if the Expo token is missing
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The repository secret EXPO_TOKEN is not set. See docs/03-build/ci.md."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # Gradle's downloads and compiled outputs, kept between runs.
      - name: Restore the Gradle cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build ${{ env.FILE }}
        id: build
        # Shorter than the job's limit, so a build that runs too long fails here and its log is still kept.
        timeout-minutes: 100
        env:
          # Real phones only: 64-bit and 32-bit ARM. Leaving out the two emulator architectures halves the native compile.
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a,armeabi-v7a
        run: |
          mkdir -p build
          set -o pipefail
          eas build --platform android --profile "${{ matrix.profile }}" --local --non-interactive --output "build/$FILE" 2>&1 | tee build/build.log

      # Saved as soon as the build has worked, even if publishing then fails, so the next build starts warm.
      - name: Save the Gradle cache
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Publish ${{ env.FILE }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          VARIANT: ${{ matrix.variant }}
          PROFILE: ${{ matrix.profile }}
        run: |
          if [ "$EVENT" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
            # Several builds run at once for one tag; whichever is first creates the release.
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "Ba7dhek $TAG" --generate-notes || true
            gh release upload "$TAG" "build/$FILE" --clobber
          else
            TAG="build-$VARIANT"
            # One pre-release per variant, replaced each time, so its page always holds the newest build.
            gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$TAG" "build/$FILE" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --latest=false \
              --title "Latest $VARIANT build" \
              --notes "Built from \`$(git rev-parse --short=7 HEAD)\` with the \`$PROFILE\` profile. Replaced by the next \`$VARIANT\` build."
          fi
          echo "### Published \`$FILE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # On failure, the end of the build log in the run's summary page, where it is quickest to read.
      - name: Show the end of the build log
        if: failure()
        run: |
          if [ -f build/build.log ]; then
            {
              echo "### End of the build log"
              echo '```'
              tail -n 120 build/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  ios-simulator:
    name: iOS simulator
    if: github.event_name == 'workflow_dispatch' && inputs.ios_simulator
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FILE: ba7dhek-v${{ needs.plan.outputs.version }}-ios-simulator-${{ needs.plan.outputs.sha }}.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build ${{ env.FILE }}
        timeout-minutes: 100
        run: |
          mkdir -p build
          eas build --platform ios --profile simulator --local --non-interactive --output "build/$FILE"

      - name: Publish ${{ env.FILE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-ios-simulator"
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" "build/$FILE" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Latest iOS simulator build" \
            --notes "For the iOS simulator on a Mac. Cannot be installed on an iPhone."
